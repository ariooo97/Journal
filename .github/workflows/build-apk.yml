name: Build Binary Journal APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Project files:"
          find project -maxdepth 5 -type f | sort | head -200

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android project root:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"

          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 -type f | sort

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinaryJournal-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

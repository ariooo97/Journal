name: Build Binary Journal APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          echo "Extracted:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinaryJournal-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

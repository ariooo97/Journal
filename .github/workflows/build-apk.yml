name:  Binary Journal APK Builder 

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project

          unzip -q "${{ steps.zip.outputs.zip }}" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -100

      - name: Locate Android project
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          ROOT_DIR=$(dirname "$ROOT")

          echo "Android project found at:"
          echo "$ROOT_DIR"

          echo "$ROOT_DIR" > project_path.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          PROJECT=$(cat project_path.txt)

          echo "Building project:"
          echo "$PROJECT"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found"
            exit 1
          fi

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinaryJournal-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Binary Journal APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "ZIP=$ZIP"
          test -n "$ZIP"

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$SETTINGS"
          echo "Found: $SETTINGS"

          ROOT=$(dirname "$SETTINGS")
          echo "$ROOT" > project_root.txt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ROOT=$(cat project_root.txt)
          cd "$ROOT"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinaryJournal-APK
          path: project/**/build/outputs/apk/debug/*.apk
